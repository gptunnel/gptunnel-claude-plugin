name: evals

# Runs real Claude sessions against mocked GPTunneL tools. Manual: it costs API credits.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        plugin: [gptunnel, gptunnel-claude]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --global --silent @anthropic-ai/claude-code
      - name: claude plugin eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: scripts/eval.sh ${{ matrix.plugin }} --runs 3 --threshold 0.66 --max-cost-usd 5
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: evals-${{ matrix.plugin }}
          path: evals/results/${{ matrix.plugin }}/
